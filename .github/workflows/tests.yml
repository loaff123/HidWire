name: Linux scalar-contract tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Python ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install build tools and pinned test oracle
        run: |
          python -m pip install 'setuptools==84.0.0' 'wheel==0.48.0'
          python -m pip install --no-deps --require-hashes -r tests_oracle/requirements.txt
      - name: Test source
        env:
          PYTHONPATH: src
        run: python -m unittest discover -v
      - name: Detect targeted mutations
        if: matrix.python-version == '3.12'
        run: |
          python scripts/verify_mutations.py
          python scripts/verify_comparison_mutations.py
      - name: Build wheel and source distribution
        run: |
          python - <<'PY'
          from setuptools.build_meta import build_wheel, build_sdist
          build_wheel('dist')
          build_sdist('dist')
          PY
      - name: Install wheel without runtime dependencies
        run: python -m pip install --no-index --no-deps --force-reinstall dist/*.whl
      - name: Test installed wheel outside checkout
        shell: bash
        run: |
          test_root="$(mktemp -d "$RUNNER_TEMP/hidwire-installed.XXXXXX")"
          cp -R tests tests_oracle fixtures examples "$test_root/"
          cd "$test_root"
          test ! -e src
          unset PYTHONPATH
          python -I - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          import subprocess
          import sys
          import hidwire
          location = Path(hidwire.__file__).resolve()
          checkout = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          assert not location.is_relative_to(checkout), location
          assert location.is_relative_to(Path(sys.prefix).resolve()), location
          assert not importlib.metadata.requires('hidwire')
          print('Installed package:', location, flush=True)
          subprocess.run([sys.executable, '-I', '-m', 'hidwire', '--version'], check=True)
          subprocess.run([sys.executable, '-I', '-m', 'hidwire', 'compare',
                          'fixtures/real/circuitpython-mouse.bin',
                          'fixtures/real/circuitpython-mouse.bin',
                          '--old-format', 'binary', '--new-format', 'binary'], check=True)
          PY
          python -m unittest discover -v
